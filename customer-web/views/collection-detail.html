<main class="w-full min-h-screen bg-[#f8f9fa]">
  <section class="w-full bg-white border-b border-[#EBEAE5]">
    <div class="max-w-[1600px] mx-auto px-4 md:px-12 py-6">
      <nav class="flex items-center gap-2 text-xs text-[#74777e] mb-6">
        <a class="hover:text-[#000f22] cursor-pointer" onclick="dieuHuong('home')">Trang chủ</a>
        <span>/</span>
        <a class="hover:text-[#000f22] cursor-pointer" onclick="dieuHuong('collections')">Bộ sưu tập</a>
        <span>/</span>
        <span id="collectionDetailBreadcrumb" class="text-[#a23e18] font-semibold">Chi tiết bộ sưu tập</span>
      </nav>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-14 items-center">
        <div class="max-w-2xl">
          <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#f3f4f5] text-[#a23e18] text-[11px] uppercase tracking-widest font-semibold">
            <span class="w-1.5 h-1.5 rounded-full bg-[#a23e18]"></span>
            Bộ sưu tập tuyển chọn
          </span>
          <h1 id="collectionDetailTitle" class="font-['Playfair_Display',serif] text-3xl md:text-5xl text-[#000f22] font-semibold mt-4">Đang tải bộ sưu tập...</h1>
          <p id="collectionDetailDescription" class="font-['Plus_Jakarta_Sans',sans-serif] text-sm md:text-base text-[#43474d] leading-relaxed mt-4"></p>
          <div class="flex items-center gap-3 mt-6">
            <span class="material-symbols-outlined text-[#a23e18]">inventory_2</span>
            <span id="collectionDetailCount" class="text-sm text-[#74777e]">Đang tải sản phẩm...</span>
          </div>
        </div>
        <div class="relative aspect-[16/10] lg:aspect-[4/3] rounded-xl overflow-hidden bg-[#f3f4f5] shadow-xl">
          <img id="collectionDetailImage" class="w-full h-full object-cover" src="" alt="Ảnh bộ sưu tập" hidden>
        </div>
      </div>
    </div>
  </section>

  <section class="max-w-[1600px] mx-auto px-4 md:px-12 py-10">
    <div class="flex items-end justify-between gap-4 mb-6">
      <div>
        <span class="text-[11px] uppercase tracking-[0.18em] text-[#a23e18] font-bold">Tuyển phẩm</span>
        <h2 class="font-['Playfair_Display',serif] text-2xl md:text-3xl text-[#000f22] font-semibold mt-1">Sản phẩm trong bộ sưu tập</h2>
      </div>
      <a class="text-sm font-semibold text-[#000f22] hover:text-[#a23e18] cursor-pointer" onclick="dieuHuong('collections')">← Tất cả bộ sưu tập</a>
    </div>
    <div id="collectionProductsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <div class="col-span-full py-12 text-center text-[#74777e]">Đang tải sản phẩm của bộ sưu tập...</div>
    </div>
  </section>
</main>
