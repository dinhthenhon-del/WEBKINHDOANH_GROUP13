@if (isLoginPage()) {
  <!-- Trang Đăng nhập không hiển thị Sidebar & Header -->
  <router-outlet></router-outlet>
} @else {
  <!-- Khung Master Layout Quản Trị (Sidebar + Header + Content) -->
  <div class="flex h-screen bg-[#fdf9f1] overflow-hidden">
    <app-sidebar></app-sidebar>
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
      <app-header></app-header>
      <main class="flex-1 overflow-y-auto p-4 md:p-8">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
}
